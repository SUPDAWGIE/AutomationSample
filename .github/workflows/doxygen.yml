name: Game Documentation

# Define the events that trigger this workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Specify permissions required for this workflow
permissions:
  pages: write
  deployments: write
  id-token: write

# Define environment variables
env:
  CONAN_REVISIONS_ENABLED: 1

# Define the jobs to run in this workflow
jobs:
  docs:
    runs-on: windows-latest

    # Define the environment for this job
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Define the steps to run in this job
    steps:
      - name: Check Installed Software
        run: where git & where python & where pip
        shell: cmd
        
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
          # Make sure the repository URL and branch name are correct
          repository: SUPDAWGIE/AutomationSample
          ref: main  # If your default branch is named "main"

      - name: Set up Git
        run: |
          git config --global user.email "shofpita@gmail.com"
          git config --global user.name "SUPDAWGIE"
          git config --global credential.helper store

      - name: Install Conan
        run: pip install conan
        
      - name: Install Doxygen
        run: conan download doxygen/1.9.4@#2af713e135f12722e3536808017ba086:e94378795f92fbf88bb8cef7f9c2f38c4ecf9126 --remote conancenter
        
      - name: Run Doxygen
        run: doxygen devops\docs\Doxyfile
        
      - name: Upload Docs
        uses: actions/upload-pages-artifact@v1
        with:
          path: Documentation\html
        
      - name: Setup Pages
        uses: actions/configure-pages@v2
        
      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1

    # Define environment variables specific to this job
    env:
      CONAN_REVISIONS_ENABLED: 1
      # Make sure you've added the PAT_TOKEN secret and it's correctly named
      GH_PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
